<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veterinaria Genérica</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ===== Inicio de sesión ===== -->
  <section id="login" class="login">
    <form id="formLogin" class="login__caja" autocomplete="on">
      <div class="login__logo">🐾</div>
      <h1>Veterinaria Genérica</h1>
      <p class="login__sub">Ingrese con su usuario del sistema</p>

      <label for="loginUsuario">Usuario</label>
      <input id="loginUsuario" name="nombreUsuario" type="text" autocomplete="username" required autofocus>

      <label for="loginPassword">Contraseña</label>
      <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>

      <p id="loginError" class="error" hidden></p>
      <button type="submit" class="btn btn--primario btn--ancho">Ingresar</button>

      <p class="login__ayuda">
        Usuarios de prueba: <code>admin / admin123</code>, <code>lprada / vet12345</code>, <code>mrey / recep123</code>
      </p>
    </form>
  </section>

  <!-- ===== Aplicación ===== -->
  <div id="app" class="app" hidden>
    <aside class="menu" id="menu">
      <div class="menu__marca">🐾 <span>Veterinaria</span></div>
      <nav id="menuNav"></nav>
    </aside>

    <div class="principal">
      <header class="barra">
        <button id="btnMenu" class="btn btn--icono menu__toggle" aria-label="Abrir menú">☰</button>
        <h2 id="tituloModulo">Panel</h2>
        <div class="barra__usuario">
          <span id="infoUsuario"></span>
          <button id="btnSalir" class="btn btn--secundario">Salir</button>
        </div>
      </header>
      <main id="contenido" class="contenido"></main>
    </div>
  </div>

  <!-- ===== Formulario modal (crear / editar) ===== -->
  <dialog id="modal" class="modal">
    <form id="formModal" method="dialog" novalidate>
      <header class="modal__cab">
        <h3 id="modalTitulo"></h3>
        <button type="button" id="modalCerrar" class="btn btn--icono" aria-label="Cerrar">✕</button>
      </header>
      <div id="modalCampos" class="modal__campos"></div>
      <p id="modalError" class="error" hidden></p>
      <footer class="modal__pie">
        <button type="button" id="modalCancelar" class="btn btn--secundario">Cancelar</button>
        <button type="submit" id="modalGuardar" class="btn btn--primario">Guardar</button>
      </footer>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/api.js"></script>
  <script src="js/crud.js"></script>
  <script src="js/modulos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
