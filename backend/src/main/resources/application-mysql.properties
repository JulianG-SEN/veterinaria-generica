# Perfil MySQL: ejecutar con  ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# Antes, ejecutar database/VeterinariaGenerica.sql en MySQL (crea tablas y datos iniciales).
spring.datasource.url=jdbc:mysql://localhost:3306/VeterinariaGenerica?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.h2.console.enabled=false
