spring.application.name=VeterinariaGenerica
server.port=8095

# Base de datos H2 en memoria (Modo MySQL para cero configuracion externa)
spring.datasource.url=jdbc:h2:mem:veterinariagenerica;DB_CLOSE_DELAY=-1;MODE=MySQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuracion JPA Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# Respeta exactamente los nombres de columna del diseno (idTipoDocumento, numeroDocumento, ...)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Locale y Timezone
spring.jackson.time-zone=America/Bogota
spring.jackson.locale=es_CO
spring.sql.init.encoding=UTF-8
